# ─────────────────────────────────────────────────────────────
# PLAY PIECES
# Your visual work, shown on the Play page in this order (top = first).
# Visual pieces are just for looking — they aren't clickable, unless you
# give one a "link" (see below).
#
# To add a piece:
#   1. Upload the file into the folder  content/images/play/
#   2. Copy the example below, remove the "# " at the start of each line,
#      and fill it in. Add new pieces at the bottom of this file.
#
#   file:  the file name inside content/images/play/
#   type:  "image" for a picture, "video" for a short looping clip (MP4)
#   poster: videos only — a still image (in the same folder) shown
#          until the video loads. Leave this line out for images.
#   alt:   a short description of the piece, read aloud to people
#          who can't see the image
#   title: (optional) short label that appears on hover, e.g. the project
#   tags:  (optional) small labels shown next to the title on hover,
#          in square brackets, separated by commas
#   link:  (optional) a web address, e.g. a live prototype. The piece then
#          opens it in a new tab when clicked. Leave it out otherwise.
#   (The Home and Work gallery has its own list: content/home-gallery.yaml)
#
# Example:
# - file: "poster-series-01.jpg"
#   type: "image"
#   alt: "Three posters in pastel colors showing a cartoon rabbit"
#   title: "Poster series"
#   tags: ["Illustration", "Print"]
#
# - file: "motion-study.mp4"
#   type: "video"
#   poster: "motion-study-poster.jpg"
#   alt: "Short looping animation of ..."
# ─────────────────────────────────────────────────────────────

- file: "ladle-demo.mp4"
  type: "video"
  poster: "ladle-demo-poster.jpg"
  alt: "Phone prototype of a food-logging app: the camera opens, a photo of a plate is recognized as garlic chicken stir-fry, one serving of 302 kcal is logged, and the home screen shows the calories left for the day"
  link: "https://ladle-prototype-mf0ousxdy-ladle.vercel.app/"
