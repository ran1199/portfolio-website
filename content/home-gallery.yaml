# ─────────────────────────────────────────────────────────────
# HOME & WORK GALLERY
# The grid on the Home page and the Work page, in this order (top = first).
# Both pages always show the same grid.
#
# HOW THE GRID IS BUILT (on laptops)
#   • Case studies appear in pairs, side by side, about 1.5× as wide as a
#     visual piece. Two case studies in a row of this list form one pair.
#   • The visual pieces listed after a pair flow below it in 3 columns.
#   • Each tile takes the shape of its image or video automatically.
#   On tablets everything is 2 columns wide, on phones 1 column.
#
# FIELDS
#   type:   "case-study" (clickable, opens the case study)
#           or "visual" (just for looking, never clickable)
#   study:  case studies only — the case study's file name, without ".md"
#           (e.g. galactic-guardians). Its title and one-line summary
#           come from that file.
#   file:   the image or video in the folder  content/images/gallery/
#           For case studies, leave this out to use the case study's own
#           tile image or cover.
#           Anything written as [PLACEHOLDER…] shows a grey placeholder tile.
#   poster: videos only — a still image (same folder, same size as the
#           video) shown until the video loads. The tile's shape comes from it.
#   alt:    a short description of the image, read aloud to people who
#           can't see it
#   fit:    cover   = the image fills the whole tile (photos, videos);
#                     the edges may be trimmed a little, so keep important
#                     details away from the very edges
#           contain = the image sits centered on the grey tile with space
#                     around it (logos, phone mockups, transparent PNGs)
#   ratio:  only used while the file is missing: the placeholder's shape,
#           as width/height (e.g. "4/5", "16/9"). Once the real file is in,
#           its own shape is used automatically.
#
# TO ADD A VISUAL PIECE: upload the file into content/images/gallery/,
# then replace the [PLACEHOLDER…] lines of a slot below (or copy a slot).
# ─────────────────────────────────────────────────────────────

- type: case-study
  study: galactic-guardians

- type: visual
  file: "gallery-01.jpg"
  alt: "Two laptop screens showing a colorful toy-store game: a wheel of animal toys, and a screen that says Drag to match the zone! with animal figures on a shelf"
  fit: cover
  ratio: "4/5"

