<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:900px;background:#E7E4DE;font-family:Inter,sans-serif;color:#1D1C1A;overflow:hidden}
.wrap{display:grid;grid-template-columns:1fr 520px;align-items:center;height:100%;padding:0 140px 0 160px;box-sizing:border-box;gap:80px}
.eyebrow{font-size:26px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1D6962}
h1{font-family:"Inter Display",Inter,sans-serif;font-size:132px;line-height:1;margin:18px 0 26px;font-weight:800;letter-spacing:-.03em}
.tag{font-size:40px;line-height:1.3;color:#3d3a35;max-width:900px;margin:0}
.meta{margin-top:56px;font-size:26px;color:#5D5953;line-height:1.6}
.meta b{color:#1D1C1A;font-weight:600}
.shot{width:520px;display:flex;justify-content:center}
.shot img{height:820px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.18))}
.close h1{font-size:110px}
</style></head><body><div class="wrap" id="wrap"></div>
<script>
const p=new URLSearchParams(location.search);
const shot='<div class="shot"><img src="'+p.get('img')+'"></div>';
document.getElementById('wrap').innerHTML = p.get('kind')==='close'
 ? '<div class="close"><div class="eyebrow">Recap</div><h1>ToyMatch</h1><p class="tag">A faster, more confident toy choice, with reviews and clear reasons why it fits the child.</p><div class="meta"><b>Ran Guo</b> · Product demonstration for the Go To Market team</div></div>'+shot
 : '<div><div class="eyebrow">Product demonstration · Go To Market team</div><h1>ToyMatch</h1><p class="tag">A faster, more confident toy choice, with reviews and clear reasons why it fits the child.</p><div class="meta"><b>Ran Guo</b> · 17-629 Product Management Essentials II · Product Assignment 4<br>iPhone app prototype · sample data</div></div>'+shot;
</script></body></html>
