<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ToyMatch Concept 1</title>
<meta name="description" content="ToyMatch Concept 1: an interactive iPhone prototype for choosing a birthday gift for a child aged 3 to 12. All prices, reviews and availability are sample demo data.">
<style>
/*
  ToyMatch — Concept 1 (iPhone app prototype, previewed in a browser at iPhone 17 size: 402 × 874 pt)
  Layout: one iPhone-sized app column. On a computer it sits centered in a phone frame;
  on a phone it fills the screen. Each screen is an iOS-style stacked view.
*/
:root {
  --desk: #E7E4DE;        /* area around the phone on a computer */
  --frame: #1C1B1A;       /* phone bezel */
  --app: #F4F3F0;         /* app background (grouped iOS background) */
  --surface: #FFFFFF;     /* cards and sheets */
  --ink: #1D1C1A;         /* main text */
  --ink-2: #5D5953;       /* secondary text */
  --ink-3: #85807A;       /* captions */
  --line: #E2DFD9;        /* hairlines */
  --accent: #1D6962;      /* ToyMatch teal: buttons, links, selection */
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EFED;
  --sun: #E9A21F;         /* rating stars, gift ribbon */
  --fit: #2B7348;         --fit-soft: #E4F2E8;      /* known fit */
  --unsure: #7F5500;      --unsure-soft: #FAEFD6;   /* uncertain fit */
  --warn: #A13A1F;        --warn-soft: #FBE6DF;     /* caution / warnings */
  --demo: #5C4F8F;        --demo-soft: #ECE8F7;     /* "sample data" labels */
  --tile-a: #FBE7D6; --tile-b: #DFECF6; --tile-c: #E3F1E1; --tile-d: #EDE5F6; --tile-e: #FAF0CC;

  --font-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --t-large: 1.875rem;   /* 30px large title */
  --t-title: 1.375rem;   /* 22px */
  --t-head: 1.0625rem;   /* 17px headline / body */
  --t-sub: 0.9375rem;    /* 15px */
  --t-foot: 0.8125rem;   /* 13px */
  --t-cap: 0.75rem;      /* 12px */

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 44px;
  --r-card: 16px; --r-btn: 14px; --r-chip: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0F0F0E; --frame: #000000; --app: #121211; --surface: #1E1E1C;
    --ink: #F2F0EC; --ink-2: #B3AEA6; --ink-3: #8E8981; --line: #34332F;
    --accent: #5DB8AD; --accent-ink: #0B2421; --accent-soft: #1A3330; --sun: #F0B447;
    --fit: #7ACB95; --fit-soft: #1B3224; --unsure: #E8B75E; --unsure-soft: #372B13;
    --warn: #F29A80; --warn-soft: #3B2019; --demo: #B8ACEB; --demo-soft: #2A2540;
    --tile-a: #3A2D22; --tile-b: #213040; --tile-c: #223224; --tile-d: #2E2739; --tile-e: #36301A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0F0F0E; --frame: #000000; --app: #121211; --surface: #1E1E1C;
  --ink: #F2F0EC; --ink-2: #B3AEA6; --ink-3: #8E8981; --line: #34332F;
  --accent: #5DB8AD; --accent-ink: #0B2421; --accent-soft: #1A3330; --sun: #F0B447;
  --fit: #7ACB95; --fit-soft: #1B3224; --unsure: #E8B75E; --unsure-soft: #372B13;
  --warn: #F29A80; --warn-soft: #3B2019; --demo: #B8ACEB; --demo-soft: #2A2540;
  --tile-a: #3A2D22; --tile-b: #213040; --tile-c: #223224; --tile-d: #2E2739; --tile-e: #36301A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--ink);
  font-family: var(--font-body); font-size: var(--t-head); line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Stage + phone frame ---------- */
.stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s3); padding-block: var(--s6); padding-inline: var(--s4); }
.phone {
  position: relative; width: 402px; max-width: 100%; height: min(874px, calc(100% - 80px));
  background: var(--app); border-radius: 56px; overflow: hidden;
  box-shadow: 0 0 0 11px var(--frame), 0 0 0 12px color-mix(in srgb, var(--frame) 70%, #888), 0 30px 60px -20px rgba(0,0,0,.35);
  display: flex; flex-direction: column;
}
.statusbar { flex: 0 0 auto; height: 62px; padding: 0 34px 0 46px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 16px; background: var(--app); position: relative; z-index: 3; }
.statusbar .island { position: absolute; left: 50%; top: 11px; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: var(--frame); }
.statusbar svg { display: block; }
.homebar { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); opacity: .85; z-index: 5; pointer-events: none; }
.screen { position: relative; flex: 1 1 auto; min-height: 0; }
.stage-note { font-size: var(--t-cap); color: var(--ink-2); text-align: center; display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; justify-content: center; }
.stage-note button { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: var(--t-cap); padding: 6px 4px; text-decoration: underline; text-underline-offset: 2px; }

/* On a real phone (or a narrow/short window), the app fills the screen */
@media (max-width: 500px), (max-height: 700px) {
  .stage { padding: 0; gap: 0; }
  .phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  .statusbar, .homebar, .stage-note { display: none; }
}

/* ---------- Views ---------- */
.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; background: var(--app); }
.view.enter { animation: enter .22s ease-out both; }
.view.enter-back { animation: enterBack .22s ease-out both; }
@keyframes enter { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes enterBack { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view.enter, .view.enter-back { animation: none; } }

.nav { position: sticky; top: 0; z-index: 4; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; padding: 0 var(--s2); background: color-mix(in srgb, var(--app) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid transparent; }
.nav.scrolled { border-bottom-color: var(--line); }
.nav-title { font-weight: 600; font-size: var(--t-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; text-align: center; }
.back { justify-self: start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 2px; border: 0; background: none; color: var(--accent); font-size: var(--t-head); max-width: 130px; }
.back span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-right { justify-self: end; display: flex; align-items: center; }
.iconbtn { width: 44px; height: 44px; border: 0; background: none; color: var(--accent); display: grid; place-items: center; border-radius: 12px; }
.iconbtn.spin svg { animation: spin .5s ease-out; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn .ic-refresh { flex: 0 0 auto; }
.refresh-note { display: flex; gap: 8px; align-items: flex-start; font-size: var(--t-foot); color: var(--accent); background: var(--accent-soft); padding: var(--s3); border-radius: 12px; }
.refresh-note svg { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 1px; }
.toy-card.fresh { animation: fade .3s ease-out both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .iconbtn.spin svg, .toy-card.fresh { animation: none; } }
.linkbtn { border: 0; background: none; color: var(--accent); font-size: var(--t-head); min-height: 44px; padding: 0 8px; }

.content { flex: 1 0 auto; padding: var(--s2) var(--s4) var(--s7); display: flex; flex-direction: column; gap: var(--s5); }
.large-title { font-family: var(--font-display); font-size: var(--t-large); line-height: 1.12; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.large-title:focus { outline: none; }
.lede { margin: 0; color: var(--ink-2); font-size: var(--t-sub); }
h2 { font-family: var(--font-display); font-size: var(--t-title); line-height: 1.2; margin: 0; font-weight: 700; text-wrap: balance; }
h3 { font-size: var(--t-head); margin: 0; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: var(--t-foot); }
.caption { font-size: var(--t-cap); color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border-radius: var(--r-card); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); min-width: 0; }
.group { display: flex; flex-direction: column; gap: var(--s2); }
.group-label { font-size: var(--t-foot); color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; padding-inline: var(--s1); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 52px; padding: 0 var(--s5); border-radius: var(--r-btn); border: 0; font-weight: 600; font-size: var(--t-head); text-decoration: none; text-align: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary[aria-disabled="true"] { opacity: .45; }
.btn-secondary { background: var(--accent-soft); color: var(--accent); }
.btn-plain { background: none; color: var(--accent); min-height: 44px; }
.btn-block { width: 100%; }
.bottom-bar { position: sticky; bottom: 0; z-index: 4; margin-top: auto; padding: var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--app) 90%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s2); }
@media (min-width: 501px) and (min-height: 701px) { .bottom-bar { padding-bottom: 30px; } }
.bottom-bar .hint { font-size: var(--t-foot); color: var(--ink-2); text-align: center; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { min-height: 44px; padding: 0 var(--s4); border-radius: var(--r-chip); border: 1.5px solid var(--line); background: var(--surface); font-size: var(--t-sub); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.unsure[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--app); }
.chip .tick { display: none; }
.chip[aria-pressed="true"] .tick { display: inline; }
.age-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s2); }
.age-grid .chip { justify-content: center; padding: 0; font-size: var(--t-head); font-variant-numeric: tabular-nums; border-radius: 12px; }

/* Form fields */
.field { display: flex; align-items: center; gap: var(--s2); min-height: 52px; padding: 0 var(--s4); border-radius: 12px; background: var(--app); border: 1.5px solid var(--line); }
.field:focus-within { border-color: var(--accent); }
.field input { flex: 1; min-width: 0; border: 0; background: none; font-size: var(--t-head); min-height: 48px; outline: none; font-variant-numeric: tabular-nums; }
.field .prefix { color: var(--ink-2); font-weight: 600; }
.field[aria-invalid="true"], .card[aria-invalid="true"] { border-color: var(--warn); }
.card[aria-invalid="true"] { box-shadow: 0 0 0 1.5px var(--warn); }
.q { display: flex; flex-direction: column; gap: 2px; }
.q-help { font-size: var(--t-foot); color: var(--ink-2); }
.err { color: var(--warn); font-size: var(--t-foot); font-weight: 600; }
.date-note { font-size: var(--t-foot); color: var(--ink-2); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-cap); font-weight: 600; padding: 3px 8px; border-radius: 6px; line-height: 1.3; }
.badge-demo { background: var(--demo-soft); color: var(--demo); }
.badge-fit { background: var(--fit-soft); color: var(--fit); }
.badge-unsure { background: var(--unsure-soft); color: var(--unsure); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.demo-note { display: flex; gap: var(--s2); align-items: flex-start; font-size: var(--t-foot); color: var(--demo); background: var(--demo-soft); padding: var(--s3); border-radius: 12px; }
.demo-note svg { flex: 0 0 auto; margin-top: 1px; }

/* Toy art */
.art { flex: 0 0 auto; border-radius: 14px; display: grid; place-items: center; overflow: hidden; }
.art svg { width: 82%; height: 82%; display: block; }
.tile-a { background: var(--tile-a); } .tile-b { background: var(--tile-b); } .tile-c { background: var(--tile-c); } .tile-d { background: var(--tile-d); } .tile-e { background: var(--tile-e); }

/* Rating */
.rating { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-foot); color: var(--ink-2); flex-wrap: wrap; }
.rating strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.star { color: var(--sun); }

/* Home */
.home { justify-content: space-between; }
.home .content { justify-content: flex-start; gap: var(--s6); padding-top: var(--s4); }
.home-art { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
.home-art .art { aspect-ratio: 1; }
.home-art .art:nth-child(2) { transform: translateY(14px); }
.promise { display: flex; flex-direction: column; gap: var(--s3); margin: 0; padding: 0; list-style: none; }
.promise li { display: flex; gap: var(--s3); align-items: flex-start; font-size: var(--t-sub); }
.promise .dot { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }

/* Shortlist */
.summary { display: flex; flex-wrap: wrap; gap: 6px; }
.summary .pill { font-size: var(--t-foot); padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.summary .pill b { color: var(--ink); font-weight: 600; }
.toy-card { background: var(--surface); border-radius: var(--r-card); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.toy-main { display: flex; gap: var(--s3); padding: var(--s4) var(--s4) var(--s3); text-align: left; background: none; border: 0; width: 100%; align-items: flex-start; }
.toy-main .art { width: 88px; height: 88px; }
.toy-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.toy-name { font-weight: 650; font-size: var(--t-head); line-height: 1.25; }
.toy-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: var(--t-foot); color: var(--ink-2); }
.toy-meta .price { color: var(--ink); font-weight: 700; font-size: var(--t-sub); }
.why { margin: 0 var(--s4); padding: var(--s3); border-radius: 12px; background: var(--app); font-size: var(--t-foot); display: flex; flex-direction: column; gap: 6px; }
.why-line { display: flex; gap: 8px; align-items: flex-start; }
.why-line svg { flex: 0 0 auto; margin-top: 2px; }
.toy-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: var(--s2) var(--s2) var(--s2) var(--s4); }
.cmp-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 var(--s3); border-radius: 12px; border: 0; background: none; color: var(--ink); font-size: var(--t-sub); font-weight: 500; }
.box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--ink-3); display: grid; place-items: center; }
.cmp-toggle[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cmp-toggle[aria-disabled="true"] { opacity: .45; }
.details-link { color: var(--accent); font-weight: 600; font-size: var(--t-sub); border: 0; background: none; min-height: 44px; padding: 0 var(--s3); display: inline-flex; align-items: center; gap: 2px; }
.rank { font-size: var(--t-cap); font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.filter-note { font-size: var(--t-foot); color: var(--ink-2); }

/* Compare */
.cmp { --cols: 2; display: flex; flex-direction: column; gap: 0; background: var(--surface); border-radius: var(--r-card); }
.cmp-head { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: var(--s2); padding: var(--s3); position: sticky; top: 44px; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: var(--r-card) var(--r-card) 0 0; }
.cmp-col-head { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cmp-col-head .art { width: 100%; height: 64px; }
.cmp-col-head .nm { font-size: var(--t-foot); font-weight: 650; line-height: 1.25; }
.cmp-row { padding: var(--s3); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.cmp-row:last-child { border-bottom: 0; }
.cmp-label { font-size: var(--t-cap); font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.cmp-vals { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: var(--s2); font-size: var(--t-foot); line-height: 1.35; }
.cmp-vals > div { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 4px; }
.cmp-vals .big { font-size: var(--t-sub); font-weight: 700; font-variant-numeric: tabular-nums; }
.cmp-vals ul { margin: 0; padding-left: 14px; }
.cmp-vals li + li { margin-top: 3px; }
.cmp-foot { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: var(--s2); padding: var(--s3); }
.cmp-foot .btn { min-height: 44px; padding: 0 6px; font-size: var(--t-foot); }
.cmp-best { font-size: var(--t-cap); font-weight: 700; color: var(--fit); }

/* Details */
.hero-art { width: 100%; aspect-ratio: 1.45; border-radius: 20px; position: relative; }
.hero-art svg { width: 60%; height: 80%; }
.hero-art .badge { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; font-size: var(--t-sub); margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; min-width: 0; }
.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: var(--t-sub); }
.list li { display: flex; gap: 10px; align-items: flex-start; }
.list li svg { flex: 0 0 auto; margin-top: 3px; }
.reason { display: flex; gap: 10px; align-items: flex-start; }
.reason .ic { flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; }
.reason .ic.known { background: var(--fit-soft); color: var(--fit); }
.reason .ic.unsure { background: var(--unsure-soft); color: var(--unsure); }
.reason .ic.caution { background: var(--warn-soft); color: var(--warn); }
.reason-t { font-weight: 600; font-size: var(--t-sub); }
.reason-d { font-size: var(--t-foot); color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.split { display: grid; grid-template-columns: 1fr; gap: var(--s3); }
.sources { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: var(--t-foot); color: var(--ink-2); }
.sources li { display: flex; gap: 8px; }
.warn-box { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: var(--s3); font-size: var(--t-foot); display: flex; flex-direction: column; gap: 6px; }
.warn-box ul { margin: 0; padding-left: 18px; color: var(--ink); }
.toy-title { display: flex; flex-direction: column; gap: 6px; }

/* Retailer */
.buy-toy { display: flex; gap: var(--s3); align-items: center; }
.buy-toy .art { width: 72px; height: 72px; }
.retailer { display: flex; align-items: center; gap: var(--s3); }
.retailer-logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff; }
.retailer-logo.brightcart { background: #3E6FB0; }
.retailer-logo.harbor { background: #7A4E9E; }
.retailer-logo.amazon { background: #3D4B5C; }
.retailer-logo.target { background: #8A5A3C; }
.offers { display: flex; flex-direction: column; gap: var(--s3); }
.offer { display: flex; gap: var(--s3); align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r-card); padding: var(--s4); }
.offer[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  function score(t, inp) {
    let s = 0;
    const m = interestMatches(t, inp);
    if (m.length) s += 3 + (m.length - 1);
    s += 0.8 * ageCenter(t, inp.age);
    s += evidence(t);
    if (overlapsOwned(t, inp)) s -= 2.5;

  function evaluate(inp) {
    const deadline = parseISO(inp.deadline);
    const budget = budgetValue(inp);
    const out = { age: 0, budget: 0, time: 0 };
    const eligible = [];
    for (const t of TOYS) {
      if (inp.age < t.ageMin || inp.age > t.ageMax) { out.age++; continue; }
      if (t.price > budget) { out.budget++; continue; }
      if (deliveryDate(t) > deadline) { out.time++; continue; }
      eligible.push(t);
    }
    const scored = eligible.map(t => ({ t, s: score(t, inp), m: interestMatches(t, inp) }))
      .sort((a, b) => b.s - a.s || b.t.ratings - a.t.ratings);
    let list = [];
    if (interestsKnown(inp)) {
      list = scored.filter(x => x.m.length).slice(0, 5);
      if (list.length < 3) list = list.concat(scored.filter(x => !x.m.length).slice(0, 3 - list.length));
    } else {
      // Interests unknown: cover different kinds of play instead of guessing one.
      const seen = new Set();
      for (const x of scored) { if (!seen.has(x.t.kind)) { seen.add(x.t.kind); list.push(x); } if (list.length === 5) break; }
      if (list.length < 3) for (const x of scored) { if (!list.includes(x)) list.push(x); if (list.length === 3) break; }
    }
    // Pool for "Refresh": toys matching known interests when there are at least 3, otherwise every toy that fits.
    const matched = scored.filter(x => x.m.length);
    const pool = (interestsKnown(inp) && matched.length >= 3 ? matched : scored).map(x => x.t);
    return { list: list.map(x => x.t), pool, excluded: out, eligible: eligible.length, total: TOYS.length };
  }

  /* Fit explanation: each line says whether it is known, uncertain, or a caution. */
  function reasons(t, inp) {

    const pos = (inp.age - t.ageMin) / Math.max(1, t.ageMax - t.ageMin);
    let ageTxt = "Made for ages " + t.ageMin + "–" + t.ageMax + ". ";
    if (c >= 0.5) ageTxt += aAge(inp.age, true) + " is in the middle of that range.";
    else if (pos > 0.5) ageTxt += aAge(inp.age, true) + " is near the top of the range, so it may feel simple.";
    else ageTxt += aAge(inp.age, true) + " is near the start of the range, so an adult may need to help at first.";
    r.push({ key: "age", s: c >= 0.5 ? "known" : "unsure", title: "Age fit", text: ageTxt });

    r.push({ key: "budget", s: "known", title: "Within budget", text: money(t.price) + " listed price, within your " + moneyShort(budgetValue(inp)) + " limit." });

    const dd = deliveryDate(t), dl = parseISO(inp.deadline), spare = daysBetween(dd, dl);
    r.push({ key: "time", s: spare >= 2 ? "known" : "unsure", title: "Timing", text: "Estimated delivery " + fmtDay(dd) + (spare === 0 ? ", the same day as your date. That's tight; estimates can change." : ", " + spare + (spare === 1 ? " day" : " days") + " before " + fmtShort(dl) + ". Estimates can change.") });

    const m = interestMatches(t, inp);
    if (interestsKnown(inp)) {
      if (m.length) r.push({ key: "interest", s: "known", title: "Matches a known interest", text: "You said they like " + m.map(i => labelOf(INTERESTS, i).toLowerCase()).join(" and ") + ". Play style: " + t.playStyle.toLowerCase() + "." });
      else r.push({ key: "interest", s: "caution", title: "Outside their listed interests", text: "Included because few toys matched your interests and all your limits. It's here for age fit and sample reviews." });
    } else {

    }

    if (inp.ownedUnsure || !ownedKnown(inp)) r.push({ key: "owned", s: "unsure", title: "May already own something similar", text: "You weren't sure what toys they have. Check with a parent if you can." });
    else if (overlapsOwned(t, inp)) r.push({ key: "owned", s: "caution", title: "Similar to toys they have", text: "You said they already have " + labelOf(OWNED, t.kind).toLowerCase() + ". This could overlap." });
    else r.push({ key: "owned", s: "known", title: "Different from toys they have", text: inp.ownedNone ? "You said they have none of the listed toy types." : "Not the same type as the toys you listed." });

    else lines.push({ s: "caution", t: "Outside the interests you listed" });

    lines.push({ s: a.s, t: a.s === "known" ? "Good age fit (ages " + t.ageMin + "–" + t.ageMax + ")" : (inp.age > (t.ageMin + t.ageMax) / 2 ? "Top of age range (" + t.ageMin + "–" + t.ageMax + "); may feel simple" : "Start of age range (" + t.ageMin + "–" + t.ageMax + "); may need help") });

  /* Refresh: keep toys picked for comparison, swap the rest for toys not yet shown.
     Every toy still fits age, budget and date. When all have been seen, start again. */
  function refreshIdeas() {
    const res = currentResult(), pool = res.pool.map(t => t.id);
    const current = shownList().map(t => t.id);
    const n = Math.max(3, Math.min(5, current.length));
    const pinned = current.filter(id => state.compare.includes(id));
    const others = pool.filter(id => !current.includes(id));
    if (!others.length) { state.listNote = "No other toys fit all your answers. These are all of them."; return; }
    let unseen = others.filter(id => !state.seen.includes(id));
    let restarted = false;
    if (!unseen.length) { restarted = true; state.seen = pinned.slice(); unseen = others; }
    const fresh = [];
    if (!interestsKnown(state.inputs)) {
      // Interests unknown: prefer kinds of play not already on the list.
      const kinds = new Set(pinned.map(id => TOY[id].kind));

    state.list = next;

      (pinned.length ? "; kept " + pinned.length + " you\u2019re comparing." : ".") +

  }

            '<div class="toy-actions">' +
              '<button type="button" class="cmp-toggle" data-action="cmp" data-id="' + t.id + '" aria-pressed="' + on + '"' + (dis ? ' aria-disabled="true"' : '') + '><span class="box">' + (on ? ICON.box : '') + '</span>' + (dis ? 'Compare (max 3)' : 'Compare') + '</button>' +
              '<button type="button" class="details-link" data-action="open" data-id="' + t.id + '">Details ' + ICON.chev + '</button>' +
            '</div></article>';
        }).join("") +
        (canRefresh ? '<button type="button" class="btn btn-secondary btn-block" data-action="refresh">' + ICON.refresh + 'Show different ideas</button>' : '') +
        '<p class="filter-note">' + esc(filterNote) + '</p>' +
        '<div class="demo-note">' + ICON.info + '<span>Prices, ratings, review summaries, stock and delivery are sample data for this prototype, not real listings or real customer reviews.</span></div>';
    }
    const c = state.compare.length;
    const bar = n >= 2 ? '<div class="bottom-bar"><p class="hint" id="cmpHint">' + (c < 2 ? "Select 2 or 3 toys to compare" : c + " selected · up to 3") + '</p>' +
      '<button type="button" class="btn btn-primary btn-block" data-action="compare"' + (c < 2 ? ' aria-disabled="true"' : '') + '>' + (c < 2 ? "Compare" : "Compare " + c + " toys") + '</button></div>' : '';
    return '<div class="view">' + navBar({ title: "Gift ideas", right: (canRefresh ? '<button type="button" class="iconbtn" data-action="refresh" aria-label="Refresh: show different ideas" title="Show different ideas">' + ICON.refresh + '</button>' : '') + '<button type="button" class="linkbtn" data-action="back">Edit</button>' }) +
      '<div class="content">' +
        '<div class="group"><h1 class="large-title" tabindex="-1">' + (n ? n + " gift idea" + (n === 1 ? "" : "s") + " for " + aAge(inp.age) : "No matches yet") + '</h1>' + summaryPills(inp) + '</div>' +
        body + '</div>' + bar + '</div>';
  }

  /* ---------- Screen: Compare ---------- */
  function vCompare() {
    const inp = state.inputs, toys = state.compare.map(id => TOY[id]).filter(Boolean);
    const cols = toys.length;
    const lowest = Math.min.apply(null, toys.map(t => t.price));
    const row = (label, fn) => '<div class="cmp-row"><div class="cmp-label">' + label + '</div><div class="cmp-vals">' + toys.map(t => '<div>' + fn(t) + '</div>').join("") + '</div></div>';
    const fitCell = t => shortWhy(t, inp).map(l => '<span class="badge badge-' + (l.s === "known" ? "fit" : l.s === "unsure" ? "unsure" : "warn") + '" style="white-space:normal">' + esc(l.t) + '</span>').join("");
    return '<div class="view">' + navBar({ title: "Compare" }) +
      '<div class="content" style="gap:var(--s4)">' +
        '<div class="group"><h1 class="large-title" tabindex="-1">Compare ' + cols + ' toys</h1><p class="lede">Same details for each toy. Sample data.</p></div>' +
        '<div class="cmp" style="--cols:' + cols + '">' +
          '<div class="cmp-head">' + toys.map(t => '<div class="cmp-col-head">' + art(t) + '<span class="nm">' + esc(t.name) + '</span></div>').join("") + '</div>' +
          row("Listed price", t => '<span class="big">' + money(t.price) + '</span>' + (cols > 1 && t.price === lowest ? '<span class="cmp-best">Lowest</span>' : '')) +
          row("Age range", t => '<span class="big">' + t.ageMin + '–' + t.ageMax + '</span><span class="muted">' + (ageCenter(t, inp.age) >= 0.5 ? "Middle of range for " + inp.age : (inp.age > (t.ageMin + t.ageMax) / 2 ? "Top of range for " + inp.age : "Start of range for " + inp.age)) + '</span>') +
          row("Play style", t => esc(t.playStyle)) +
          row("Fit", fitCell) +
          row("Sample reviews", t => '<span><span class="star" aria-hidden="true">★</span> <b class="num">' + t.rating.toFixed(1) + '</b></span><span class="muted">' + ratingsText(t.ratings) + ' ratings</span>') +
          row("Strengths", t => '<ul>' + t.strengths.slice(0, 2).map(s => '<li>' + esc(s) + '</li>').join("") + '</ul>') +
          row("Drawbacks", t => '<ul>' + t.drawbacks.map(s => '<li>' + esc(s) + '</li>').join("") + '</ul>') +
          row("Assembly", t => esc(t.assembly.short)) +
          row("Batteries", t => esc(t.batteries.short)) +
          row("Warnings", t => '<span style="color:var(--warn)">' + esc(t.warnings[0]) + '</span>' + (t.warnings.length > 1 ? '<span class="muted">+' + (t.warnings.length - 1) + ' more in details</span>' : '')) +
          row("Delivery", t => '<span>' + esc(fmtDay(deliveryDate(t))) + '</span><span class="muted">' + esc(RETAILERS[t.retailer].name) + ' (est.)</span>') +
          '<div class="cmp-foot">' + toys.map(t => '<button type="button" class="btn btn-secondary" data-action="open" data-id="' + t.id + '">Details</button>').join("") + '</div>' +
        '</div>' +
        '<div class="demo-note">' + ICON.info + '<span>Review strengths and drawbacks are sample summaries written for this prototype, not real customer reviews.</span></div>' +
      '</div></div>';
  }

  /* ---------- Screen: Toy details ---------- */
  function vToy(id) {
    const t = TOY[id], inp = state.inputs, r = RETAILERS[t.retailer];
    const on = state.compare.includes(t.id), full = state.compare.length >= 3;
    const rs = reasons(t, inp);
    const limits = t.limits.slice();
    if (!interestsKnown(inp)) limits.push("You weren’t sure about their interests, so this pick isn’t based on what they like.");
    if (!ownedKnown(inp)) limits.push("You weren’t sure what toys they already own, so this could duplicate something.");
    limits.push("Fit is based on your answers and the product’s age label. ToyMatch can’t confirm it suits this particular child.");
    return '<div class="view">' + navBar({ title: "Details" }) +
      '<div class="content">' +
        '<div class="hero-art art tile-' + t.tile + '"><svg viewBox="0 0 120 120" role="img" aria-label="Illustration of ' + esc(t.name) + '">' + ILLO[t.illo] + '</svg><span class="badge">Illustration, not a product photo</span></div>' +
        '<div class="toy-title"><span class="caption">' + esc(t.maker) + ' (sample brand)</span><h1 class="large-title" style="font-size:var(--t-title)" tabindex="-1">' + esc(t.name) + '</h1>' +
          '<div class="toy-meta"><span class="price num" style="font-size:var(--t-head)">' + money(t.price) + '</span><span>Ages ' + t.ageMin + '–' + t.ageMax + '</span>' + ratingHtml(t) + '</div></div>' +

        '<section class="card" aria-labelledby="h-fit"><h2 id="h-fit">Why it may fit</h2>' +
          '<div class="legend"><span class="badge badge-fit">' + ICON.check + ' From your answers</span><span class="badge badge-unsure">' + ICON.q + ' Uncertain</span><span class="badge badge-warn">' + ICON.bang + ' Check this</span></div>' +
          rs.map(x => '<div class="reason"><span class="ic ' + x.s + '">' + statusIcon(x.s) + '</span><div><div class="reason-t">' + esc(x.title) + '</div><div class="reason-d">' + esc(x.text) + '</div></div></div>').join("") +
        '</section>' +

        '<section class="card" aria-labelledby="h-rev"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 id="h-rev">What buyers say</h2>' + DEMO_BADGE + '</div>' +
          '<p class="small muted"><b style="color:var(--ink)"><span class="star">★</span> ' + t.rating.toFixed(1) + '</b> average from ' + ratingsText(t.ratings) + ' sample ratings, ' + esc(t.reviewSpan) + '. Summaries are written for this prototype, not taken from real reviews.</p>' +
          '<div class="split"><div class="group"><h3 style="color:var(--fit)">Often praised</h3><ul class="list">' + t.strengths.map(s => '<li><span style="color:var(--fit)">' + ICON.check + '</span><span>' + esc(s) + '</span></li>').join("") + '</ul></div>' +
          '<div class="group"><h3 style="color:var(--warn)">Common complaints</h3><ul class="list">' + t.drawbacks.map(s => '<li><span style="color:var(--warn)">' + ICON.bang + '</span><span>' + esc(s) + '</span></li>').join("") + '</ul></div></div>' +
          '<div class="group"><h3 class="small" style="color:var(--ink-2)">Sources (sample)</h3><ul class="sources">' +
            '<li>• <span>' + esc(r.name) + ' product reviews: ' + ratingsText(t.ratings) + ' ratings, ' + esc(t.reviewSpan) + '. Demo reference; no live link.</span></li>' +
            '<li>• <span>' + esc(t.maker) + ' product page: age guidance, contents, warnings. Demo reference; no live link.</span></li></ul></div>' +
        '</section>' +

        '<section class="card" aria-labelledby="h-req"><h2 id="h-req">Before you buy</h2>' +
          '<dl class="kv"><dt>Assembly</dt><dd>' + esc(t.assembly.detail) + '</dd><dt>Batteries</dt><dd>' + esc(t.batteries.detail) + '</dd><dt>In the box</dt><dd>' + esc(t.pieces) + '</dd><dt>Size</dt><dd>' + esc(t.size) + '</dd></dl>' +
          '<div class="warn-box"><b>Manufacturer warnings</b><ul>' + t.warnings.map(w => '<li>' + esc(w) + '</li>').join("") + '</ul></div>' +
        '</section>' +

        '<section class="card" aria-labelledby="h-lim"><h2 id="h-lim">Limitations</h2><ul class="list">' + limits.map(l => '<li><span style="color:var(--unsure)">' + ICON.q + '</span><span>' + esc(l) + '</span></li>').join("") + '</ul></section>' +
        '<button type="button" class="cmp-toggle" style="align-self:flex-start" data-action="cmp" data-id="' + t.id + '" aria-pressed="' + on + '"' + (!on && full ? ' aria-disabled="true"' : '') + '><span class="box">' + (on ? ICON.box : '') + '</span>' + (!on && full ? 'Compare list is full (3)' : on ? 'In your compare list' : 'Add to compare') + '</button>' +
      '</div>' +
      '<div class="bottom-bar"><button type="button" class="btn btn-primary btn-block" data-action="choose" data-id="' + t.id + '">Choose this toy</button></div></div>';
  }

  /* ---------- Screen: Retailer ---------- */
  function vRetailer(id, key) {
    const t = TOY[id], inp = state.inputs, dl = parseISO(inp.deadline);
    const list = offers(t), sel = offerFor(t, key);
    const fastest = Math.min.apply(null, list.map(o => o.days)), cheapest = Math.min.apply(null, list.map(o => o.price));
    const card = o => {
      const r = RETAILERS[o.key], dd = addDays(startOfToday(), o.days), spare = daysBetween(dd, dl), on = o.key === sel.key;
      const tags = (o.days === fastest ? '<span class="badge badge-fit">Fastest delivery</span>' : '') + (o.price === cheapest && o.was ? '<span class="badge badge-fit">Lowest price</span>' : '');
      return '<button type="button" class="offer" role="radio" aria-checked="' + on + '" data-action="pick-retailer" data-id="' + t.id + '" data-ret="' + o.key + '">' +
        '<span class="retailer-logo ' + r.cls + '" aria-hidden="true">' + r.initial + '</span>' +
        '<span class="offer-body">' +
          '<span class="offer-top"><span class="offer-name">' + esc(r.name) + '</span><span class="offer-price">' + money(o.price) + (o.was ? '<s>' + money(o.was) + '</s>' : '') + '</span></span>' +
          (tags || o.was ? '<span class="offer-tags">' + tags + (o.was ? '<span class="badge badge-demo">Sample discount</span>' : '') + '</span>' : '') +
          '<span class="offer-line">Estimated delivery <b style="color:var(--ink)">' + esc(fmtDay(dd)) + '</b><br>' +
            (spare >= 0 ? spare + (spare === 1 ? " day" : " days") + " before your " + esc(fmtShort(dl)) + " date" : '<span style="color:var(--warn);font-weight:600">May arrive after your ' + esc(fmtShort(dl)) + ' date</span>') + '</span>' +
          '<span class="offer-line"><span class="stock ' + (o.avail === "in" ? "in" : "low") + '">' + (o.avail === "in" ? "In stock" : "Low stock") + '</span></span><span class="caption">Updated ' + esc(updatedLabel(r)) + '</span>' +
        '</span><span class="radio" aria-hidden="true"></span></button>';
    };
    const sr = RETAILERS[sel.key];
    return '<div class="view">' + navBar({ title: "Where to buy" }) +
      '<div class="content">' +
        '<div class="group"><h1 class="large-title" tabindex="-1">Choose where to buy</h1><p class="lede">Compare price and delivery, then finish on the retailer\u2019s site.</p></div>' +
        '<section class="card"><div class="buy-toy">' + art(t) + '<div class="toy-info"><span class="toy-name">' + esc(t.name) + '</span><span class="toy-meta"><span>Ages ' + t.ageMin + '\u2013' + t.ageMax + '</span><span>' + esc(t.maker) + '</span></span></div></div></section>' +
        '<div class="group"><h2 id="h-ret" style="font-size:var(--t-head)">3 retailers</h2><div class="offers" role="radiogroup" aria-labelledby="h-ret">' + list.map(card).join("") + '</div></div>' +
        '<div class="demo-note">' + ICON.info + '<span>Prices, discounts, stock and delivery are sample data for this prototype, not real Amazon, Target or other retailer listings. The retailer\u2019s own page shows the final price and delivery.</span></div>' +
        '<p class="small muted">ToyMatch doesn\u2019t handle payment. You\u2019ll check out on the retailer\u2019s site.</p>' +
      '</div>' +
      '<div class="bottom-bar"><button type="button" class="btn btn-primary btn-block" data-action="buy" data-id="' + t.id + '" data-ret="' + sel.key + '">Buy at ' + esc(sr.name) + ' \u00B7 ' + money(sel.price) + '</button></div></div>';
  }

  /* ---------- Screen: Simulated handoff ---------- */
  function vHandoff(id, key) {
    const t = TOY[id], o = offerFor(t, key), r = RETAILERS[o.key];
    return '<div class="view handoff">' +
      '<div class="content">' +
        '<div class="sim-banner" role="note"><strong>Simulated handoff</strong><span>This is a prototype. No retailer page opens, nothing is bought, and no payment is taken.</span></div>' +
        '<div class="handoff-flow" aria-hidden="true"><span class="node tm">T</span><span class="dots"><i></i><i></i><i></i></span><span class="node retailer-logo ' + r.cls + '" style="width:64px;height:64px;border-radius:18px;font-size:26px">' + r.initial + '</span></div>' +
        '<div class="group" style="gap:var(--s2)"><h1 class="large-title" style="font-size:var(--t-title)" tabindex="-1">Leaving ToyMatch for ' + esc(r.name) + '</h1>' +
          '<p class="muted">In the iPhone app, ' + esc(r.name) + '’s product page for <b style="color:var(--ink)">' + esc(t.name) + '</b> would open here, listed at ' + money(o.price) + ' (sample). Checkout happens there.</p></div>' +
        '<div class="urlbar">' + ICON.lock + '<span>' + esc(r.domain) + ' \u00B7 product page</span></div>' +
        '<p class="caption">Shown as an example only. No page opens in this prototype.</p>' +
      '</div>' +
      '<div class="bottom-bar"><button type="button" class="btn btn-secondary btn-block" data-action="back">Back to ToyMatch</button><button type="button" class="btn btn-plain btn-block" data-action="new-search">Start a new gift search</button></div></div>';
  }

  /* =========================================================
     RENDER
     ========================================================= */
  function render(dir) {
    let entry = top();
    // Guard: screens that need finished gift details send you back to the form.
    const needsInputs = ["list", "compare", "toy", "retailer", "handoff"];
    if (needsInputs.includes(entry.screen) && Object.keys(formErrors()).length) { state.stack = [{ screen: "home" }, { screen: "form" }]; entry = top(); }
    if (entry.screen === "compare" && state.compare.length < 2) { state.stack.pop(); entry = top(); }
    if (entry.id && !TOY[entry.id]) { state.stack = [{ screen: "home" }]; entry = top(); }
    save();

    let html;
    switch (entry.screen) {
      case "form": html = vForm(); break;
      case "list": html = vList(); break;
      case "compare": html = vCompare(); break;
      case "toy": html = vToy(entry.id); break;
      case "retailer": html = vRetailer(entry.id, entry.ret); break;
      case "handoff": html = vHandoff(entry.id, entry.ret); break;
      default: html = vHome();
    }
    screenEl.innerHTML = html;
    const v = screenEl.querySelector(".view");
    if (dir === "forward") v.classList.add("enter");
    if (dir === "back") v.classList.add("enter-back");
    if (entry.screen === "form") syncForm();
    v.scrollTop = dir === "refresh" || dir === "back" ? (entry.scroll || 0) : 0;
    const nav = v.querySelector(".nav");
    if (nav) { const upd = () => nav.classList.toggle("scrolled", v.scrollTop > 4); v.addEventListener("scroll", upd, { passive: true }); upd(); }
    if (dir !== "refresh") { const h = v.querySelector("h1"); if (h && dir) h.focus({ preventScroll: true }); }
    document.title = entry.screen === "home" ? "ToyMatch Concept 1" : TITLES[entry.screen] + " · ToyMatch Concept 1";
  }
  function refresh(focusSel) { rememberScroll(); render("refresh"); if (focusSel) { const el = screenEl.querySelector(focusSel); if (el) el.focus({ preventScroll: true }); } }

  /* ---------- Events ---------- */
  screenEl.addEventListener("click", e => {
    const b = e.target.closest("[data-action]"); if (!b) return;
    const a = b.dataset.action, id = b.dataset.id;
    if (a === "back") back();
    else if (a === "go") go(b.dataset.to);
    else if (a === "chip") onChip(b.dataset.group, b.dataset.value);
    else if (a === "open") go("toy", { id });
    else if (a === "cmp") {
      if (b.getAttribute("aria-disabled") === "true") return;
      state.compare = state.compare.includes(id) ? state.compare.filter(x => x !== id) : state.compare.concat(id);
      save(); refresh('[data-action="cmp"][data-id="' + id + '"]');
    }
    else if (a === "compare") { if (state.compare.length >= 2) go("compare"); else { const h = screenEl.querySelector("#cmpHint"); if (h) { h.textContent = "Select at least 2 toys first"; h.style.color = "var(--warn)"; } } }
    else if (a === "refresh") {
      refreshIdeas(); save(); state.justRefreshed = true;
      rememberScroll(); top().scroll = 0; render("refresh"); delete state.justRefreshed; save();
      const btn = screenEl.querySelector('.nav [data-action="refresh"]');
      if (btn) { btn.classList.add("spin"); btn.focus({ preventScroll: true }); }
    }
    else if (a === "choose") go("retailer", { id });
    else if (a === "pick-retailer") { top().ret = b.dataset.ret; save(); refresh('[data-action="pick-retailer"][data-ret="' + b.dataset.ret + '"]'); }
    else if (a === "buy") go("handoff", { id, ret: b.dataset.ret });
    else if (a === "new-search") { state = freshState(); state.stack.push({ screen: "form" }); save(); render("forward"); }
  });
  screenEl.addEventListener("input", e => {
    if (e.target.id === "budget") { state.inputs.budget = e.target.value.replace(/[^0-9.]/g, ""); if (e.target.value !== state.inputs.budget) e.target.value = state.inputs.budget; save(); syncForm(); }
  });
  screenEl.addEventListener("change", e => {
    if (e.target.id === "deadline") { state.inputs.deadline = e.target.value; save(); syncForm(); }
  });
  screenEl.addEventListener("submit", e => { e.preventDefault(); submitForm(); });
  document.getElementById("restart").addEventListener("click", () => { state = freshState(); save(); render("forward"); });

  // Expose the matcher for testing in the browser console.
  window.ToyMatch = { evaluate, TOYS, offers };
  render();
})();
</script>

</html>
