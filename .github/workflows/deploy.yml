# Publishes the website to GitHub Pages.
# Runs automatically every time a change is saved to the repository's
# default branch. You can also start it by hand from the "Actions" tab.
name: Publish website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two changes are saved close together, finish publishing the first
# one before starting the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch is published; other branches are just drafts.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
