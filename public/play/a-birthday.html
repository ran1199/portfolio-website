<title>Rolling Birthday Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: the poster as a single sheet on a quiet table, a slim control strip beneath it */
:root{
  --table:#ecebe8; --ink:#2b2829; --muted:#6f6a69; --line:#d6d3cf;
  --paper:#ffffff; --red:#ed1c24; --title:#231f20; --control:#ffffff;
  --display:Impact,"Anton","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --serif:"Iowan Old Style","Libre Caslon Text","Palatino Linotype",Palatino,Georgia,serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --table:#1b1a1a; --ink:#ece9e7; --muted:#a39d9b; --line:#3a3737; --control:#262424; color-scheme:dark}}
:root[data-theme="dark"]{--table:#1b1a1a; --ink:#ece9e7; --muted:#a39d9b; --line:#3a3737; --control:#262424; color-scheme:dark}
html,body{background:var(--table);color:var(--ink)}
body{font-family:var(--ui);padding-inline:16px;padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet{width:100%;aspect-ratio:612/792;max-width:100%;background:var(--paper);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px -12px rgba(0,0,0,.25)}
.sheet svg{display:block;width:100%;height:100%}
.route{font-family:var(--display);font-size:13.6px;fill:var(--red);white-space:pre;text-rendering:geometricPrecision}
.head{font-family:var(--serif);fill:var(--title)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:13px;color:var(--muted)}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--control);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button svg{width:11px;height:11px;fill:currentColor}
.speed{display:flex;align-items:center;gap:8px;margin-left:auto}
input[type=range]{accent-color:var(--red);width:120px}
.credit{font-size:12px;color:var(--muted);letter-spacing:.02em;margin:0}
@media (max-width:420px){.speed{margin-left:0}}
</style>

<script>
(() => {
  const poem = `My heart is like a singing bird
  Whose nest is in a water'd shoot;
My heart is like an apple-tree
  Whose boughs are bent with thick-set fruit;
My heart is like a rainbow shell
  That paddles in a halcyon sea;
My heart is gladder than all these,
  Because my love is come to me.
Raise me a daïs of silk and down;
  Hang it with vair and purple dyes;
Carve it in doves and pomegranates,
  And peacocks with a hundred eyes;
Work it in gold and silver grapes,
  In leaves and silver fleurs-de-lys;
Because the birthday of my life
  Is come, my love is come to me.`.split('\n').map(s => s.trim()).join(' ');
  const unit = poem + '   ';

  const $ = id => document.getElementById(id);
  const routes = [
    { tp: $('tpA'), path: $('routeA'), phase: 0 },
    { tp: $('tpB'), path: $('routeB'), phase: 0.42 }
  ];
  const playBtn = $('play'), dirBtn = $('dir'), speedIn = $('speed');
  const icons = {
    pause: '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="3" height="8"/><rect x="6" y="1" width="3" height="8"/></svg>Pause',
    play: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>Play'
  };

  let C = 1, dist = 0, dir = 1, last = null;
  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;

  function layout() {
    const m = $('measure');
    m.textContent = unit.repeat(4);
    C = m.getComputedTextLength() / 4 || 3800;
    m.textContent = '';
    for (const r of routes) {
      const L = r.path.getTotalLength();
      r.tp.textContent = unit.repeat(Math.ceil(L / C) + 2);
    }
    draw();
  }
  function draw() {
    for (const r of routes) {
      const x = ((dist + r.phase * C) % C + C) % C;
      r.tp.setAttribute('startOffset', (x - C).toFixed(2));
    }
  }
  function tick(t) {
    if (last !== null && playing) dist += dir * (+speedIn.value) * Math.min(t - last, 100) / 1000;
    last = t;
    draw();
    requestAnimationFrame(tick);
  }
  function setPlay(p) {
    playing = p;
    playBtn.innerHTML = p ? icons.pause : icons.play;
    playBtn.setAttribute('aria-pressed', String(p));
  }
  playBtn.addEventListener('click', () => setPlay(!playing));
  dirBtn.addEventListener('click', () => { dir *= -1; });

  setPlay(playing);
  layout();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(layout);
  requestAnimationFrame(tick);
})();
</script>
